<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Lesson...</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="lessonRoot">
  <!-- Populated by JS -->
  <p style="text-align:center;padding:80px 0;color:var(--text-dim);">Loading lesson&hellip;</p>
</div>

<footer class="site-footer">
  &copy; 2026 Aesop's Storyhouse LLC
</footer>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const lessonId = parseInt(params.get('id'), 10);
  if (!lessonId) { location.href = 'index.html'; return; }

  /* Font size preference */
  const FONT_SIZES = [16, 18, 20, 22, 24];
  let fontIdx = parseInt(localStorage.getItem('cpm_fontIdx') || '2', 10);

  function applyFontSize() {
    document.documentElement.style.setProperty('--fs-story', FONT_SIZES[fontIdx] + 'px');
    document.querySelectorAll('.font-btn').forEach((b, i) => {
      b.classList.toggle('active', i === fontIdx);
    });
    localStorage.setItem('cpm_fontIdx', fontIdx);
  }

  fetch('lessons.json')
    .then(r => r.json())
    .then(lessons => {
      const lesson = lessons.find(l => l.id === lessonId);
      if (!lesson || lesson.comingSoon) {
        document.getElementById('lessonRoot').innerHTML =
          '<p style="text-align:center;padding:80px 0;">This lesson is not available yet. <a href="index.html">Go back</a></p>';
        return;
      }

      const prefix = lesson.type === 'science' ? 'S' : 'H';
      const num = lesson.type === 'science' ? lesson.id : lesson.id - 45;

      document.title = prefix + num + ': ' + lesson.title + ' — Robert & William';

      const completed = JSON.parse(localStorage.getItem('cpm_completed') || '{}');
      const isDone = !!completed[lesson.id];

      /* Previous / Next (only available lessons) */
      const available = lessons.filter(l => !l.comingSoon);
      const curIdx = available.findIndex(l => l.id === lessonId);
      const prev = curIdx > 0 ? available[curIdx - 1] : null;
      const next = curIdx < available.length - 1 ? available[curIdx + 1] : null;

      function prevNextLabel(l) {
        if (!l) return '';
        const p = l.type === 'science' ? 'S' : 'H';
        const n = l.type === 'science' ? l.id : l.id - 45;
        return p + n + ': ' + l.title;
      }

      const root = document.getElementById('lessonRoot');
      root.innerHTML = '';
      root.classList.add('fade-in');

      /* ---- Nav ---- */
      const nav = document.createElement('nav');
      nav.className = 'lesson-nav';
      nav.innerHTML =
        '<a href="index.html" class="back-btn" title="Back to lessons">&larr;</a>' +
        '<span class="lesson-nav-title">' + lesson.title + '</span>' +
        '<span class="lesson-nav-num">' + prefix + num + '</span>';
      root.appendChild(nav);

      /* ---- Meta ---- */
      const meta = document.createElement('div');
      meta.className = 'lesson-meta';
      meta.innerHTML =
        '<span class="topic-badge">' + lesson.topic + '</span>' +
        '<span class="reading-time">' + lesson.readingTime + ' read</span>' +
        '<div class="font-controls">' +
          '<button class="font-btn" data-fi="0" title="Smallest">A</button>' +
          '<button class="font-btn" data-fi="1" title="Small">A</button>' +
          '<button class="font-btn" data-fi="2" title="Medium">A</button>' +
          '<button class="font-btn" data-fi="3" title="Large">A</button>' +
          '<button class="font-btn" data-fi="4" title="Largest">A</button>' +
        '</div>';
      root.appendChild(meta);

      /* font buttons */
      meta.querySelectorAll('.font-btn').forEach(btn => {
        const fi = parseInt(btn.dataset.fi);
        btn.style.fontSize = FONT_SIZES[fi] * 0.6 + 'px';
        btn.addEventListener('click', () => { fontIdx = fi; applyFontSize(); });
      });
      applyFontSize();

      /* ---- Story (with scene images if available) ---- */
      const story = document.createElement('div');
      story.className = 'story-content';

      if (lesson.images) {
        /* Parse story HTML and interleave AI-generated images */
        const tmp = document.createElement('div');
        tmp.innerHTML = lesson.story;
        const blocks = Array.from(tmp.children);
        const img = lesson.images;
        const perBlock = blocks.length > 0 ? img.count / blocks.length : 1;
        let imgIdx = 0;

        blocks.forEach((block, bi) => {
          /* Insert scene image(s) before this block */
          const imgsForBlock = Math.round((bi + 1) * perBlock) - Math.round(bi * perBlock);
          if (imgsForBlock === 1) {
            const num = String(imgIdx + 1).padStart(3, '0');
            const el = document.createElement('img');
            el.className = 'scene-img';
            el.src = img.basePath + img.prefix + num + '.jpg';
            el.alt = 'Scene illustration';
            el.loading = 'lazy';
            story.appendChild(el);
            imgIdx++;
          } else if (imgsForBlock >= 2) {
            const pair = document.createElement('div');
            pair.className = 'scene-pair';
            for (let k = 0; k < imgsForBlock && imgIdx < img.count; k++) {
              const num = String(imgIdx + 1).padStart(3, '0');
              const el = document.createElement('img');
              el.src = img.basePath + img.prefix + num + '.jpg';
              el.alt = 'Scene illustration';
              el.loading = 'lazy';
              pair.appendChild(el);
              imgIdx++;
            }
            story.appendChild(pair);
          }
          story.appendChild(block);
        });
      } else {
        story.innerHTML = lesson.story;
      }

      root.appendChild(story);

      /* ---- Discussion ---- */
      const disc = document.createElement('div');
      disc.className = 'discussion';
      disc.innerHTML = '<h2>Let\'s Think About It!</h2><ol>' +
        lesson.discussion.map(q => '<li>' + q + '</li>').join('') +
        '</ol>';
      root.appendChild(disc);

      /* ---- Quiz ---- */
      const quizWrap = document.createElement('div');
      quizWrap.className = 'quiz';
      quizWrap.innerHTML = '<h2>Quiz Time!</h2>';

      const savedAnswers = JSON.parse(localStorage.getItem('cpm_quiz_' + lesson.id) || '{}');

      lesson.quiz.forEach((item, qi) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'quiz-question';
        qDiv.innerHTML = '<p>' + (qi + 1) + '. ' + item.q + '</p>';

        const optsDiv = document.createElement('div');
        optsDiv.className = 'quiz-options';

        item.options.forEach((opt, oi) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-opt';
          btn.textContent = opt;

          /* Restore saved state */
          if (savedAnswers[qi] !== undefined) {
            btn.classList.add('chosen');
            if (oi === item.correct) btn.classList.add('correct');
            else if (oi === savedAnswers[qi]) btn.classList.add('incorrect');
          }

          btn.addEventListener('click', () => {
            if (optsDiv.querySelector('.chosen')) return;
            optsDiv.querySelectorAll('.quiz-opt').forEach(b => b.classList.add('chosen'));
            if (oi === item.correct) {
              btn.classList.add('correct');
              fb.textContent = 'Correct!';
              fb.className = 'quiz-feedback right';
            } else {
              btn.classList.add('incorrect');
              optsDiv.children[item.correct].classList.add('correct');
              fb.textContent = 'Not quite — the answer is: ' + item.options[item.correct];
              fb.className = 'quiz-feedback wrong';
            }
            savedAnswers[qi] = oi;
            localStorage.setItem('cpm_quiz_' + lesson.id, JSON.stringify(savedAnswers));
          });

          optsDiv.appendChild(btn);
        });

        qDiv.appendChild(optsDiv);

        const fb = document.createElement('div');
        fb.className = 'quiz-feedback';
        if (savedAnswers[qi] !== undefined) {
          if (savedAnswers[qi] === item.correct) {
            fb.textContent = 'Correct!';
            fb.className = 'quiz-feedback right';
          } else {
            fb.textContent = 'Not quite — the answer is: ' + item.options[item.correct];
            fb.className = 'quiz-feedback wrong';
          }
        }
        qDiv.appendChild(fb);
        quizWrap.appendChild(qDiv);
      });

      root.appendChild(quizWrap);

      /* ---- Mark Complete ---- */
      const cWrap = document.createElement('div');
      cWrap.className = 'complete-wrap';
      const cBtn = document.createElement('button');
      cBtn.className = 'complete-btn ' + (isDone ? 'completed' : 'incomplete');
      cBtn.innerHTML = isDone
        ? '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 9 L8 13 L14 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Completed!'
        : 'Mark as Complete';

      cBtn.addEventListener('click', () => {
        const c = JSON.parse(localStorage.getItem('cpm_completed') || '{}');
        if (c[lesson.id]) {
          delete c[lesson.id];
          cBtn.className = 'complete-btn incomplete';
          cBtn.innerHTML = 'Mark as Complete';
        } else {
          c[lesson.id] = true;
          cBtn.className = 'complete-btn completed';
          cBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M4 9 L8 13 L14 5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Completed!';
        }
        localStorage.setItem('cpm_completed', JSON.stringify(c));
      });

      cWrap.appendChild(cBtn);
      root.appendChild(cWrap);

      /* ---- Prev/Next ---- */
      const pager = document.createElement('div');
      pager.className = 'lesson-pager';
      pager.innerHTML =
        '<a class="pager-btn' + (prev ? '' : ' disabled') + '" href="' + (prev ? 'lesson.html?id=' + prev.id : '#') + '">' +
          '<span class="pager-dir">&larr; Previous</span>' +
          (prev ? prevNextLabel(prev) : '') +
        '</a>' +
        '<a class="pager-btn' + (next ? '' : ' disabled') + '" href="' + (next ? 'lesson.html?id=' + next.id : '#') + '" style="text-align:right;">' +
          '<span class="pager-dir">Next &rarr;</span>' +
          (next ? prevNextLabel(next) : '') +
        '</a>';
      root.appendChild(pager);
    });
})();
</script>

</body>
</html>
