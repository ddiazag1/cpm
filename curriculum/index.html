  function getIcon(topic) {
    return ICONS[topic] || ICONS['Review'] || '';
  }

  /* ---- Build lesson index from lessons.json ---- */
  fetch('lessons.json')
    .then(r => r.json())
    .then(lessons => {
      const completed = JSON.parse(localStorage.getItem('cpm_completed') || '{}');
      const scienceGrid = document.getElementById('scienceGrid');
      const historyGrid = document.getElementById('historyGrid');

      let completedCount = 0;

      lessons.forEach(l => {
        const done = !!completed[l.id];
        if (done) completedCount++;

        const card = document.createElement('a');
        const isSoon = !!l.comingSoon;
        card.className = 'lesson-card' + (isSoon ? ' coming-soon' : '');
        card.href = isSoon ? 'javascript:void(0)' : 'lesson.html?id=' + l.id;

        const prefix = l.type === 'science' ? 'S' : 'H';
        const num = l.type === 'science'
          ? l.id
          : l.id - 45;

        card.innerHTML =
          '<span class="card-number">' + prefix + num + '</span>' +
          '<span class="card-title">' + l.title + '</span>' +
          '<span class="card-topic">' + getIcon(l.topic) + ' ' + l.topic + '</span>' +
          (isSoon ? '<span class="coming-tag">Coming Soon</span>' : '') +
          '<span class="card-check' + (done ? ' done' : '') + '">' +
            '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 7 L6 10 L11 4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</span>';

        if (l.type === 'science') scienceGrid.appendChild(card);
        else historyGrid.appendChild(card);
      });

      /* Progress */
      document.getElementById('progressCount').textContent = completedCount;
      document.getElementById('progressFill').style.width = (completedCount / 90 * 100).toFixed(1) + '%';
    });

  /* ---- Tabs ---- */
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('scienceGrid').classList.toggle('hidden', tab !== 'science');
      document.getElementById('historyGrid').classList.toggle('hidden', tab !== 'history');
    });
  });
})();
</script>

</body>
</html>
