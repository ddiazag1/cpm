    width: auto;
    height: auto;
  }

  /* ── Options Grid ── */
  .test-options-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 12px 16px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  .test-option-btn {
    background: #fff;
    border: 3px solid #ddd;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .test-option-btn:hover {
    border-color: #3498db;
    transform: scale(1.03);
    box-shadow: 0 2px 8px rgba(52,152,219,0.2);
  }

  .test-option-btn.selected {
    border-color: #2ecc71;
    background: #eafaf1;
    box-shadow: 0 0 0 3px rgba(46,204,113,0.3);
  }

  .test-option-inner {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .test-option-inner svg {
    max-width: 100%;
    max-height: 100%;
  }

  .test-option-number {
    font-size: 12px;
    font-weight: 700;
    color: #999;
    margin-top: 4px;
  }

  .test-option-btn.selected .test-option-number {
    color: #2ecc71;
  }

  /* ── Navigation ── */
  .test-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 20px;
    background: #fff;
    border-top: 1px solid #e0e0e0;
  }

  .btn-nav {
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-next {
    background: #3498db;
    color: #fff;
  }
  .btn-next:hover { background: #2980b9; }

  .btn-finish {
    background: #2ecc71;
    color: #fff;
  }
  .btn-finish:hover { background: #27ae60; }

  .btn-disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .test-nav-indicator {
    font-size: 13px;
    color: #999;
    font-weight: 500;
  }

  .btn-sm {
    padding: 4px 12px;
    font-size: 12px;
  }

  .btn-outline {
    background: transparent;
    border: 1px solid #ccc;
    color: #666;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-outline:hover {
    border-color: #999;
    color: #333;
  }

  /* ── Results Screen ── */
  .results-screen {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    background: #f8f9fa;
    min-height: 100vh;
  }

  .results-header {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .results-user-info {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .results-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
  }

  .results-user-name {
    margin: 0 0 4px;
    font-size: 20px;
    color: #222;
  }

  .results-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 13px;
    color: #777;
  }

  /* Encouragement */
  .results-encouragement {
    text-align: center;
    padding: 16px;
    margin-bottom: 16px;
  }

  .results-stars {
    font-size: 36px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .results-message {
    font-size: 18px;
    font-weight: 600;
    color: #555;
    margin: 0;
  }

  /* Score Summary Cards */
  .results-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .results-summary-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 12px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .results-big-number {
    font-size: 42px;
    font-weight: 800;
    color: #222;
    line-height: 1;
  }

  .results-ordinal {
    font-size: 18px;
    font-weight: 600;
  }

  .results-big-label {
    font-size: 14px;
    color: #888;
    margin-top: 4px;
  }

  .results-big-sub {
    font-size: 12px;
    color: #aaa;
    margin-top: 2px;
  }

  .results-grade-card {
    border-left: 4px solid;
  }

  .results-grade-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }

  .results-grade-label {
    font-size: 13px;
    color: #555;
    font-weight: 500;
  }

  /* Section */
  .results-section {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .results-section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 14px;
    color: #333;
  }

  /* Bar Chart */
  .results-bar-chart {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .bar-label {
    width: 55px;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    text-align: right;
    flex-shrink: 0;
  }

  .bar-track {
    flex: 1;
    height: 24px;
    background: #f0f0f0;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 12px;
    position: relative;
    z-index: 2;
    transition: width 0.5s ease;
  }

  .bar-expected {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: rgba(0,0,0,0.08);
    border-radius: 12px;
    z-index: 1;
    border-right: 2px dashed rgba(0,0,0,0.2);
  }

  .bar-value {
    width: 40px;
    font-size: 14px;
    font-weight: 700;
    color: #333;
    flex-shrink: 0;
  }

  .bar-expected-value {
    width: 55px;
    font-size: 11px;
    color: #999;
    flex-shrink: 0;
  }

  /* Validity */
  .results-validity {
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .results-validity.valid {
    background: #eafaf1;
    color: #27ae60;
    border: 1px solid #a3d9b1;
  }

  .results-validity.invalid {
    background: #fef5e7;
    color: #e67e22;
    border: 1px solid #f5cba7;
  }

  .validity-icon {
    font-size: 18px;
    font-weight: 700;
  }

  /* Tables */
  .results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  .results-table th {
    text-align: left;
    padding: 8px 10px;
    background: #f5f5f5;
    font-weight: 600;
    color: #555;
    border-bottom: 2px solid #ddd;
  }

  .results-table td {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
  }

  .disc-warning {
    color: #e74c3c;
    font-weight: 700;
  }

  /* Item Review */
  .results-collapsible {
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .results-collapsible:hover {
    color: #3498db;
  }

  .collapse-arrow {
    font-size: 12px;
    transition: transform 0.2s;
  }

  .results-item-review {
    max-height: 400px;
    overflow-y: auto;
  }

  .results-items-table td,
  .results-items-table th {
    padding: 6px 8px;
    font-size: 13px;
    text-align: center;
  }

  .item-correct { background: #f0fdf4; }
  .item-incorrect { background: #fef2f2; }

  .icon-correct { color: #2ecc71; font-weight: 700; font-size: 16px; }
  .icon-incorrect { color: #e74c3c; font-weight: 700; font-size: 16px; }

  /* Actions */
  .results-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 20px 0 10px;
  }

  .results-actions .btn {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: #3498db;
    color: #fff;
  }
  .btn-primary:hover { background: #2980b9; }

  .btn-secondary {
    background: #ecf0f1;
    color: #555;
  }
  .btn-secondary:hover { background: #d5dbdb; }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .results-summary {
      grid-template-columns: 1fr;
    }
    .results-meta {
      flex-direction: column;
      gap: 4px;
    }
    .test-options-grid {
      gap: 6px;
      padding: 8px 10px;
    }
    .bar-expected-value {
      display: none;
    }
  }

  /* ── Print Styles ── */
  @media print {
    body {
      background: #fff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .test-screen,
    .results-actions,
    .test-topbar .btn,
    .progress-dots,
    .results-collapsible .collapse-arrow {
      display: none !important;
    }

    .results-screen {
      max-width: 100%;
      padding: 0;
      margin: 0;
      background: #fff;
      min-height: auto;
    }

    .results-header,
    .results-section,
    .results-summary-card {
      box-shadow: none;
      border: 1px solid #ddd;
      page-break-inside: avoid;
    }

    .results-encouragement {
      display: none;
    }

    .results-item-review {
      display: block !important;
      max-height: none !important;
      overflow: visible !important;
    }

    .results-summary {
      grid-template-columns: repeat(3, 1fr);
    }

    .results-grade-badge {
      border: 2px solid currentColor;
    }

    .bar-fill {
      border: 1px solid rgba(0,0,0,0.3);
    }

    .item-correct { background: #f0f0f0 !important; }
    .item-incorrect { background: #fff !important; }

    .icon-correct { color: #000 !important; }
    .icon-incorrect { color: #666 !important; }

    .results-validity.valid {
      background: #f5f5f5 !important;
      color: #333 !important;
      border-color: #999 !important;
    }

    .results-validity.invalid {
      background: #f5f5f5 !important;
      color: #333 !important;
      border-color: #999 !important;
    }

    a, .btn { color: #000 !important; }
  }

  `;
  document.head.appendChild(style);
})();

// Start the app
init();

  </script>
</body>
</html>
