<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Cognitive Assessment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#4A90D9;--green:#27AE60;--red:#E74C3C;--orange:#F39C12;--purple:#8E44AD;--teal:#1ABC9C;--pink:#E91E63;--bg:#F0F4F8;--card:#FFF;--text:#2C3E50;--radius:16px;--shadow:0 4px 15px rgba(0,0,0,.1)}
html{font-size:18px}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius);padding:14px 28px;font-size:1.1rem;font-weight:600;transition:all .2s;touch-action:manipulation;min-height:48px;min-width:48px}
button:active{transform:scale(.95)}
.container{max-width:900px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.page{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:1.8rem;text-align:center;margin:16px 0;color:var(--blue)}
h2{font-size:1.4rem;margin:12px 0;color:var(--text)}
h3{font-size:1.1rem;margin:8px 0}
.card{background:var(--card);border-radius:var(--radius);padding:24px;margin:12px 0;box-shadow:var(--shadow)}

/* Landing */
.profiles{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.profile-card{background:var(--card);border-radius:var(--radius);padding:32px 48px;box-shadow:var(--shadow);cursor:pointer;text-align:center;transition:all .2s;border:3px solid transparent;min-width:200px}
.profile-card:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,.15)}
.profile-card.sel{border-color:var(--blue)}
.profile-card .avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#FFF}
.profile-card .name{font-size:1.3rem;font-weight:700}
.profile-card .age{font-size:1rem;color:#666;margin-top:4px}

/* Module Selection */
.mod-list{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.mod-item{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.mod-item:hover{transform:translateX(4px)}
.mod-item input[type=checkbox]{width:24px;height:24px;cursor:pointer}
.mod-item .mod-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.mod-item .mod-info{flex:1}
.mod-item .mod-name{font-weight:700;font-size:1.1rem}
.mod-item .mod-desc{font-size:.85rem;color:#666}

/* Progress Bar */
.progress-bar{height:12px;background:#E0E0E0;border-radius:6px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;transition:width .3s;background:linear-gradient(90deg,var(--blue),var(--teal))}
.test-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.timer{font-size:.9rem;color:#666;background:var(--card);padding:6px 14px;border-radius:20px;box-shadow:var(--shadow)}

/* Question Area */
.question-area{text-align:center;margin:16px 0}
.question-text{font-size:1.3rem;font-weight:600;margin:16px 0;line-height:1.4}
.question-sub{font-size:1rem;color:#666;margin:8px 0}
.svg-display{display:flex;justify-content:center;margin:16px 0}
.options-grid{display:grid;gap:16px;margin:20px auto;max-width:700px}
.options-grid.cols-2{grid-template-columns:1fr 1fr}
.options-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.options-grid.cols-4{grid-template-columns:1fr 1fr}
.opt-btn{background:var(--card);border:3px solid #DDD;border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100px;position:relative}
.opt-btn:hover{border-color:var(--blue);transform:translateY(-2px)}
.opt-btn.selected{border-color:var(--blue);background:#EBF5FB}
.opt-btn .label{font-size:1.4rem;font-weight:700;color:var(--blue);margin-bottom:4px}
.opt-btn svg{max-width:120px;max-height:120px}
.next-btn{background:var(--blue);color:#FFF;padding:16px 48px;font-size:1.2rem;margin:20px auto;display:block}
.next-btn:hover{background:#357ABD}
.next-btn:disabled{opacity:.4;cursor:not-allowed}

/* Draw */
.draw-area{position:relative;background:#FFF;border-radius:var(--radius);box-shadow:var(--shadow);margin:12px auto;touch-action:none;max-width:100%}
.draw-area canvas{display:block;border-radius:var(--radius)}
.draw-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.draw-tools button{padding:10px 18px;font-size:.95rem}
.tool-active{background:var(--blue)!important;color:#FFF!important}

/* Checklist */
.checklist{max-height:60vh;overflow-y:auto;padding:8px}
.checklist-group{margin:12px 0}
.checklist-group h3{color:var(--purple);border-bottom:2px solid var(--purple);padding-bottom:4px;margin-bottom:8px}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;font-size:.95rem}
.checklist input[type=checkbox]{width:22px;height:22px;cursor:pointer}

/* Results */
.result-card{background:var(--card);border-radius:var(--radius);padding:20px;margin:12px 0;box-shadow:var(--shadow)}
.composite-score{text-align:center;padding:24px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#FFF;border-radius:var(--radius);margin:16px 0}
.composite-score .big{font-size:3rem;font-weight:700}
.composite-score .lbl{font-size:1.1rem;opacity:.9}
.bar-chart{margin:16px 0}
.bar-row{display:flex;align-items:center;gap:12px;margin:8px 0}
.bar-label{width:140px;font-size:.9rem;font-weight:600;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:28px;background:#E8E8E8;border-radius:14px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:14px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#FFF;font-size:.8rem;font-weight:600;min-width:30px}
.bar-val{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.8rem;font-weight:600}
.score-table{width:100%;border-collapse:collapse;margin:12px 0}
.score-table th,.score-table td{padding:10px 12px;text-align:left;border-bottom:1px solid #EEE}
.score-table th{background:#F8F9FA;font-weight:700;font-size:.9rem}
.score-table td{font-size:.95rem}
.classification{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:600;color:#FFF}

/* History */
.history-entry{background:var(--card);border-radius:var(--radius);padding:16px;margin:8px 0;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.history-entry:hover{transform:translateX(4px)}
.history-entry .date{font-size:.85rem;color:#666}
.history-entry .child{font-weight:700;font-size:1.1rem}
.history-entry .iq{font-size:1.3rem;font-weight:700;float:right}
.line-chart-container{background:var(--card);border-radius:var(--radius);padding:16px;margin:16px 0;box-shadow:var(--shadow);overflow-x:auto}
.action-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.btn-green{background:var(--green);color:#FFF}
.btn-red{background:var(--red);color:#FFF}
.btn-blue{background:var(--blue);color:#FFF}
.btn-purple{background:var(--purple);color:#FFF}
.btn-orange{background:var(--orange);color:#FFF}
.btn-outline{background:transparent;border:2px solid var(--blue);color:var(--blue)}
nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0;flex-wrap:wrap;gap:8px}
nav button{padding:8px 16px;font-size:.9rem}
@media(max-width:600px){
html{font-size:16px}
.profiles{flex-direction:column;align-items:center}
.options-grid.cols-4{grid-template-columns:1fr 1fr}
.bar-label{width:100px;font-size:.8rem}
.profile-card{padding:24px 32px}
}
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>

// ===== CONSTANTS & STATE =====
const CHILDREN = [
  {name:'Liam', dob:'2021-03-15', color:'#4A90D9'},
  {name:'Noah', dob:'2023-03-15', color:'#27AE60'}
];
const LS_KEY = 'kidsIqTestHistory';
let state = {page:'landing', child:null, modules:[], currentMod:0, currentQ:0, answers:{}, startTime:null, qStartTime:null, drawData:null, dapChecklist:[]};

function getAge(dob){
  const d=new Date(dob), now=new Date();
  let y=now.getFullYear()-d.getFullYear(), m=now.getMonth()-d.getMonth();
  if(m<0){y--;m+=12}
  return {years:y, months:m, total:y+m/12, label:y+' years'+(m>0?', '+m+' months':'')};
}

function saveHistory(entry){
  const h=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  h.push(entry);
  localStorage.setItem(LS_KEY,JSON.stringify(h));
}
function getHistory(){return JSON.parse(localStorage.getItem(LS_KEY)||'[]')}

// ===== SVG HELPERS =====
function svgWrap(inner,w=120,h=120){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`}

function drawShape(type,cx,cy,size,color){
  const s=size;
  switch(type){
    case 'circle': return `<circle cx="${cx}" cy="${cy}" r="${s/2}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    case 'square': return `<rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    case 'triangle': return `<polygon points="${cx},${cy-s/2} ${cx-s/2},${cy+s/2} ${cx+s/2},${cy+s/2}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    case 'diamond': return `<polygon points="${cx},${cy-s/2} ${cx+s/2},${cy} ${cx},${cy+s/2} ${cx-s/2},${cy}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    case 'cross': {
      const t=s/4;
      return `<polygon points="${cx-t},${cy-s/2} ${cx+t},${cy-s/2} ${cx+t},${cy-t} ${cx+s/2},${cy-t} ${cx+s/2},${cy+t} ${cx+t},${cy+t} ${cx+t},${cy+s/2} ${cx-t},${cy+s/2} ${cx-t},${cy+t} ${cx-s/2},${cy+t} ${cx-s/2},${cy-t} ${cx-t},${cy-t}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    }
    case 'star': {
      let pts=[];
      for(let i=0;i<5;i++){
        let a1=Math.PI/2+i*2*Math.PI/5, a2=a1+Math.PI/5;
        pts.push(`${cx+s/2*Math.cos(-a1)},${cy-s/2*Math.sin(a1)}`);
        pts.push(`${cx+s/5*Math.cos(-a2)},${cy-s/5*Math.sin(a2)}`);
      }
      return `<polygon points="${pts.join(' ')}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    }
    case 'pentagon': {
      let pts=[];
      for(let i=0;i<5;i++){let a=-Math.PI/2+i*2*Math.PI/5;pts.push(`${cx+s/2*Math.cos(a)},${cy+s/2*Math.sin(a)}`);}
      return `<polygon points="${pts.join(' ')}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    }
    case 'hexagon': {
      let pts=[];
      for(let i=0;i<6;i++){let a=i*Math.PI/3;pts.push(`${cx+s/2*Math.cos(a)},${cy+s/2*Math.sin(a)}`);}
      return `<polygon points="${pts.join(' ')}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
    }
    default: return `<circle cx="${cx}" cy="${cy}" r="${s/2}" fill="${color}" stroke="#333" stroke-width="1.5"/>`;
  }
}

const COLORS = {red:'#E74C3C',blue:'#4A90D9',green:'#27AE60',yellow:'#F1C40F',purple:'#8E44AD',orange:'#F39C12'};
const SHAPES = ['circle','square','triangle','diamond','cross','star'];


// ===== MATRIX REASONING ITEMS =====
// Each item: {cells: [topLeft, topRight, bottomLeft, bottomRight(null=missing)], options: [...], correct: index}
// Cell: {shape, color} or null for missing

function buildMatrixItems3(){
  return [
    // 1. Row-constant shape: circles top, squares bottom
    {cells:[{shape:'circle',color:'red'},{shape:'circle',color:'blue'},{shape:'square',color:'red'},null],
     options:[{shape:'square',color:'blue'},{shape:'circle',color:'blue'},{shape:'triangle',color:'red'},{shape:'square',color:'green'}],correct:0},
    // 2. Column-constant color: red left, blue right
    {cells:[{shape:'triangle',color:'red'},{shape:'triangle',color:'blue'},{shape:'circle',color:'red'},null],
     options:[{shape:'circle',color:'blue'},{shape:'circle',color:'red'},{shape:'triangle',color:'blue'},{shape:'square',color:'blue'}],correct:0},
    // 3. Same shape all: squares, different colors per row
    {cells:[{shape:'square',color:'red'},{shape:'square',color:'red'},{shape:'square',color:'blue'},null],
     options:[{shape:'square',color:'blue'},{shape:'circle',color:'blue'},{shape:'square',color:'red'},{shape:'triangle',color:'blue'}],correct:0},
    // 4. Row-constant shape: triangles top, diamonds bottom
    {cells:[{shape:'triangle',color:'green'},{shape:'triangle',color:'yellow'},{shape:'diamond',color:'green'},null],
     options:[{shape:'triangle',color:'yellow'},{shape:'diamond',color:'yellow'},{shape:'diamond',color:'green'},{shape:'circle',color:'yellow'}],correct:1},
    // 5. Column-constant color: green left, orange right
    {cells:[{shape:'circle',color:'green'},{shape:'circle',color:'orange'},{shape:'square',color:'green'},null],
     options:[{shape:'circle',color:'orange'},{shape:'square',color:'green'},{shape:'square',color:'orange'},{shape:'triangle',color:'orange'}],correct:2},
    // 6. All same color, row-constant shape
    {cells:[{shape:'diamond',color:'purple'},{shape:'diamond',color:'purple'},{shape:'star',color:'purple'},null],
     options:[{shape:'diamond',color:'purple'},{shape:'star',color:'purple'},{shape:'circle',color:'purple'},{shape:'star',color:'red'}],correct:1},
    // 7. Column-constant shape: circles left, triangles right
    {cells:[{shape:'circle',color:'red'},{shape:'triangle',color:'red'},{shape:'circle',color:'blue'},null],
     options:[{shape:'circle',color:'blue'},{shape:'triangle',color:'blue'},{shape:'triangle',color:'red'},{shape:'square',color:'blue'}],correct:1},
    // 8. Row-constant color: red top, green bottom
    {cells:[{shape:'circle',color:'red'},{shape:'square',color:'red'},{shape:'triangle',color:'green'},null],
     options:[{shape:'diamond',color:'green'},{shape:'diamond',color:'red'},{shape:'triangle',color:'red'},{shape:'circle',color:'green'}],correct:0},
    // 9. Same shape everywhere (circle), colors by column
    {cells:[{shape:'circle',color:'blue'},{shape:'circle',color:'yellow'},{shape:'circle',color:'blue'},null],
     options:[{shape:'circle',color:'yellow'},{shape:'circle',color:'blue'},{shape:'square',color:'yellow'},{shape:'circle',color:'red'}],correct:0},
    // 10. Diagonal pattern: same shape on diagonals
    {cells:[{shape:'star',color:'red'},{shape:'square',color:'blue'},{shape:'square',color:'blue'},null],
     options:[{shape:'star',color:'red'},{shape:'square',color:'blue'},{shape:'square',color:'red'},{shape:'star',color:'blue'}],correct:0},
    // 11. Row-constant shape: crosses top, circles bottom
    {cells:[{shape:'cross',color:'orange'},{shape:'cross',color:'blue'},{shape:'circle',color:'orange'},null],
     options:[{shape:'cross',color:'orange'},{shape:'circle',color:'blue'},{shape:'circle',color:'orange'},{shape:'cross',color:'blue'}],correct:1},
    // 12. Column-constant color: yellow left, purple right
    {cells:[{shape:'triangle',color:'yellow'},{shape:'square',color:'purple'},{shape:'diamond',color:'yellow'},null],
     options:[{shape:'circle',color:'purple'},{shape:'circle',color:'yellow'},{shape:'diamond',color:'purple'},{shape:'triangle',color:'purple'}],correct:0}
  ];
}

function buildMatrixItems5(){
  return [
    // 1. Row-constant shape + column-constant color
    {cells:[{shape:'circle',color:'red'},{shape:'circle',color:'blue'},{shape:'square',color:'red'},null],
     options:[{shape:'square',color:'blue'},{shape:'circle',color:'red'},{shape:'square',color:'red'},{shape:'triangle',color:'blue'},{shape:'circle',color:'blue'},{shape:'square',color:'green'}],correct:0},
    // 2. Shape changes across columns, color constant per row
    {cells:[{shape:'circle',color:'green'},{shape:'square',color:'green'},{shape:'triangle',color:'orange'},null],
     options:[{shape:'diamond',color:'orange'},{shape:'square',color:'orange'},{shape:'triangle',color:'green'},{shape:'circle',color:'orange'},{shape:'diamond',color:'green'},{shape:'square',color:'green'}],correct:1},
    // 3. Progressive: 1 dot top-left, 2 dots top-right, 3 dots bottom-left, ? bottom-right
    {cells:[{shape:'circle',color:'blue',count:1},{shape:'circle',color:'blue',count:2},{shape:'circle',color:'blue',count:3},null],
     options:[{shape:'circle',color:'blue',count:4},{shape:'circle',color:'blue',count:3},{shape:'circle',color:'blue',count:5},{shape:'circle',color:'red',count:4},{shape:'square',color:'blue',count:4},{shape:'circle',color:'blue',count:2}],correct:0},
    // 4. Row shape + column color combo
    {cells:[{shape:'triangle',color:'red'},{shape:'triangle',color:'purple'},{shape:'diamond',color:'red'},null],
     options:[{shape:'diamond',color:'purple'},{shape:'triangle',color:'purple'},{shape:'diamond',color:'red'},{shape:'circle',color:'purple'},{shape:'star',color:'red'},{shape:'diamond',color:'blue'}],correct:0},
    // 5. Size progression: small->medium->large across rows
    {cells:[{shape:'square',color:'blue',size:'small'},{shape:'square',color:'blue',size:'medium'},{shape:'square',color:'green',size:'small'},null],
     options:[{shape:'square',color:'green',size:'medium'},{shape:'square',color:'blue',size:'large'},{shape:'circle',color:'green',size:'medium'},{shape:'square',color:'green',size:'small'},{shape:'square',color:'red',size:'medium'},{shape:'square',color:'green',size:'large'}],correct:0},
    // 6. Shape rotation pattern
    {cells:[{shape:'triangle',color:'red'},{shape:'diamond',color:'red'},{shape:'triangle',color:'blue'},null],
     options:[{shape:'diamond',color:'blue'},{shape:'triangle',color:'blue'},{shape:'circle',color:'blue'},{shape:'diamond',color:'red'},{shape:'square',color:'blue'},{shape:'star',color:'blue'}],correct:0},
    // 7. Column constant shape, row constant color
    {cells:[{shape:'star',color:'yellow'},{shape:'cross',color:'yellow'},{shape:'star',color:'purple'},null],
     options:[{shape:'cross',color:'purple'},{shape:'star',color:'purple'},{shape:'cross',color:'yellow'},{shape:'diamond',color:'purple'},{shape:'star',color:'yellow'},{shape:'circle',color:'purple'}],correct:0},
    // 8. Two rules: shape per row, alternating colors
    {cells:[{shape:'circle',color:'red'},{shape:'circle',color:'blue'},{shape:'triangle',color:'blue'},null],
     options:[{shape:'triangle',color:'red'},{shape:'circle',color:'red'},{shape:'triangle',color:'blue'},{shape:'square',color:'red'},{shape:'diamond',color:'blue'},{shape:'circle',color:'blue'}],correct:0},
    // 9. Progressive count + shape constant
    {cells:[{shape:'star',color:'orange',count:2},{shape:'star',color:'orange',count:3},{shape:'star',color:'orange',count:4},null],
     options:[{shape:'star',color:'orange',count:5},{shape:'star',color:'orange',count:4},{shape:'star',color:'orange',count:6},{shape:'circle',color:'orange',count:5},{shape:'star',color:'red',count:5},{shape:'star',color:'orange',count:3}],correct:0},
    // 10. Complex: row shape + col color + size change
    {cells:[{shape:'hexagon',color:'blue'},{shape:'hexagon',color:'green'},{shape:'pentagon',color:'blue'},null],
     options:[{shape:'pentagon',color:'green'},{shape:'hexagon',color:'green'},{shape:'pentagon',color:'blue'},{shape:'circle',color:'green'},{shape:'pentagon',color:'red'},{shape:'hexagon',color:'blue'}],correct:0},
    // 11. XOR-like: shapes differ on diagonal
    {cells:[{shape:'circle',color:'red'},{shape:'square',color:'blue'},{shape:'square',color:'green'},null],
     options:[{shape:'circle',color:'orange'},{shape:'square',color:'red'},{shape:'circle',color:'purple'},{shape:'triangle',color:'blue'},{shape:'diamond',color:'green'},{shape:'circle',color:'yellow'}],correct:0},
    // 12. Three shapes cycling
    {cells:[{shape:'circle',color:'red'},{shape:'square',color:'blue'},{shape:'triangle',color:'green'},null],
     options:[{shape:'diamond',color:'orange'},{shape:'circle',color:'red'},{shape:'star',color:'purple'},{shape:'cross',color:'yellow'},{shape:'diamond',color:'red'},{shape:'hexagon',color:'blue'}],correct:0},
    // 13. Column-constant shape+different colors
    {cells:[{shape:'diamond',color:'orange'},{shape:'star',color:'orange'},{shape:'diamond',color:'purple'},null],
     options:[{shape:'star',color:'purple'},{shape:'diamond',color:'purple'},{shape:'star',color:'orange'},{shape:'cross',color:'purple'},{shape:'circle',color:'orange'},{shape:'star',color:'blue'}],correct:0},
    // 14. Additive: shapes appear progressively
    {cells:[{shape:'circle',color:'blue',count:1},{shape:'circle',color:'red',count:1},{shape:'circle',color:'blue',count:2},null],
     options:[{shape:'circle',color:'red',count:2},{shape:'circle',color:'blue',count:2},{shape:'circle',color:'red',count:1},{shape:'circle',color:'red',count:3},{shape:'square',color:'red',count:2},{shape:'circle',color:'blue',count:1}],correct:0},
    // 15. Shape transformation across rows
    {cells:[{shape:'square',color:'green'},{shape:'diamond',color:'green'},{shape:'square',color:'red'},null],
     options:[{shape:'diamond',color:'red'},{shape:'square',color:'red'},{shape:'diamond',color:'green'},{shape:'circle',color:'red'},{shape:'triangle',color:'red'},{shape:'star',color:'red'}],correct:0},
    // 16. Color blending concept
    {cells:[{shape:'circle',color:'red'},{shape:'circle',color:'blue'},{shape:'square',color:'red'},null],
     options:[{shape:'square',color:'blue'},{shape:'circle',color:'blue'},{shape:'triangle',color:'red'},{shape:'square',color:'red'},{shape:'diamond',color:'blue'},{shape:'square',color:'green'}],correct:0},
    // 17. Triple rule: shape+color+count
    {cells:[{shape:'triangle',color:'yellow',count:1},{shape:'triangle',color:'yellow',count:2},{shape:'square',color:'purple',count:1},null],
     options:[{shape:'square',color:'purple',count:2},{shape:'triangle',color:'purple',count:2},{shape:'square',color:'yellow',count:2},{shape:'square',color:'purple',count:1},{shape:'circle',color:'purple',count:2},{shape:'triangle',color:'yellow',count:3}],correct:0},
    // 18. Hardest: shape rotation + color shift
    {cells:[{shape:'star',color:'blue'},{shape:'cross',color:'green'},{shape:'cross',color:'blue'},null],
     options:[{shape:'star',color:'green'},{shape:'cross',color:'green'},{shape:'star',color:'blue'},{shape:'diamond',color:'green'},{shape:'circle',color:'blue'},{shape:'star',color:'red'}],correct:0}
  ];
}

function renderMatrixSVG(cells, sz){
  sz=sz||200;
  const cs=sz/2-4, pad=4;
  let svg='';
  const positions=[[pad,pad],[cs+pad*2,pad],[pad,cs+pad*2],[cs+pad*2,cs+pad*2]];
  for(let i=0;i<4;i++){
    const [x,y]=positions[i];
    if(cells[i]===null){
      svg+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="#F5F5F5" stroke="#999" stroke-width="2" stroke-dasharray="6,3" rx="4"/>`;
      svg+=`<text x="${x+cs/2}" y="${y+cs/2+8}" text-anchor="middle" font-size="24" fill="#999" font-weight="700">?</text>`;
    } else {
      svg+=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" fill="#FAFAFA" stroke="#CCC" stroke-width="1.5" rx="4"/>`;
      const c=cells[i], ccx=x+cs/2, ccy=y+cs/2;
      const szM = c.size==='small'?cs*0.3 : c.size==='medium'?cs*0.5 : cs*0.55;
      if(c.count && c.count>1){
        const cnt=c.count;
        if(cnt===2){
          svg+=drawShape(c.shape,ccx-szM*0.4,ccy,szM*0.6,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx+szM*0.4,ccy,szM*0.6,COLORS[c.color]||c.color);
        }else if(cnt===3){
          svg+=drawShape(c.shape,ccx,ccy-szM*0.35,szM*0.5,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx-szM*0.35,ccy+szM*0.25,szM*0.5,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx+szM*0.35,ccy+szM*0.25,szM*0.5,COLORS[c.color]||c.color);
        }else if(cnt===4){
          svg+=drawShape(c.shape,ccx-szM*0.3,ccy-szM*0.3,szM*0.45,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx+szM*0.3,ccy-szM*0.3,szM*0.45,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx-szM*0.3,ccy+szM*0.3,szM*0.45,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx+szM*0.3,ccy+szM*0.3,szM*0.45,COLORS[c.color]||c.color);
        }else if(cnt===5){
          svg+=drawShape(c.shape,ccx,ccy,szM*0.35,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx-szM*0.35,ccy-szM*0.35,szM*0.35,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx+szM*0.35,ccy-szM*0.35,szM*0.35,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx-szM*0.35,ccy+szM*0.35,szM*0.35,COLORS[c.color]||c.color);
          svg+=drawShape(c.shape,ccx+szM*0.35,ccy+szM*0.35,szM*0.35,COLORS[c.color]||c.color);
        }else{
          for(let r=0;r<2;r++)for(let cc=0;cc<3;cc++){
            svg+=drawShape(c.shape,ccx-szM*0.3+cc*szM*0.3,ccy-szM*0.2+r*szM*0.4,szM*0.28,COLORS[c.color]||c.color);
          }
        }
      } else {
        svg+=drawShape(c.shape,ccx,ccy,szM,COLORS[c.color]||c.color);
      }
    }
  }
  // Grid lines
  svg+=`<line x1="${sz/2}" y1="0" x2="${sz/2}" y2="${sz}" stroke="#AAA" stroke-width="2"/>`;
  svg+=`<line x1="0" y1="${sz/2}" x2="${sz}" y2="${sz/2}" stroke="#AAA" stroke-width="2"/>`;
  svg+=`<rect x="0" y="0" width="${sz}" height="${sz}" fill="none" stroke="#888" stroke-width="3" rx="8"/>`;
  return svgWrap(svg,sz,sz);
}

    if(cnt===2){
      svg+=drawShape(cell.shape,cx-szM*0.35,cy,szM*0.5,COLORS[cell.color]||cell.color);
      svg+=drawShape(cell.shape,cx+szM*0.35,cy,szM*0.5,COLORS[cell.color]||cell.color);

      svg+=drawShape(cell.shape,cx-szM*0.3,cy+szM*0.3,szM*0.3,COLORS[cell.color]||cell.color);
      svg+=drawShape(cell.shape,cx+szM*0.3,cy+szM*0.3,szM*0.3,COLORS[cell.color]||cell.color);
    }else{
      for(let r=0;r<2;r++)for(let c=0;c<3;c++){
        svg+=drawShape(cell.shape,cx-szM*0.25+c*szM*0.25,cy-szM*0.15+r*szM*0.35,szM*0.22,COLORS[cell.color]||cell.color);
      }
    }
  } else {
    svg+=drawShape(cell.shape,cx,cy,szM,COLORS[cell.color]||cell.color);
  }
  return svgWrap(svg,sz,sz);
}

function getVocabSVG(word){
  if(vocabSVGs[word]) return svgWrap(vocabSVGs[word]());
  if(extraSVGs[word]) return svgWrap(extraSVGs[word]());
  // Fallback
  return svgWrap(`<rect x="20" y="20" width="80" height="80" fill="#DDD" rx="8"/><text x="60" y="68" text-anchor="middle" font-size="12" fill="#666">${word}</text>`);
}

function buildVocabItems3(){
  const words=['ball','cat','shoe','tree','cup','baby','car','flower','bird','fish','hat','book','dog','house','sun'];
  return words.map(w=>{
    const distractors=vocabDistractors[w]||['ball','cat','shoe'];
    const opts=[w,...distractors];
    // Shuffle but track correct
    const shuffled=opts.map((o,i)=>({word:o,orig:i})).sort(()=>Math.random()-0.5);
    return {word:w, options:shuffled.map(s=>s.word), correct:shuffled.findIndex(s=>s.orig===0)};
  });
}

function buildVocabItems5(){
  const words=['bicycle','umbrella','envelope','helicopter','thermometer','telescope','calculator','parachute','rectangle','skeleton','microscope','volcano','flamingo','penguin','rhinoceros','accordion','binoculars','submarine','caterpillar','hammock'];
  return words.map(w=>{
    const distractors=vocabDistractors[w]||['ball','cat','shoe'];
    const opts=[w,...distractors];
    const shuffled=opts.map((o,i)=>({word:o,orig:i})).sort(()=>Math.random()-0.5);
    return {word:w, options:shuffled.map(s=>s.word), correct:shuffled.findIndex(s=>s.orig===0)};
  });
}

function buildConceptItems3(){
  const concepts=['top','bottom','big','little','in','on','under','same','different','more','empty','full'];
  return concepts.map(c=>{
    const scene=conceptScene(c);
    return {concept:c, instruction:scene.instruction, svg:scene.svg, options:scene.options, correct:scene.correct};
  });
}

function buildConceptItems5(){
  const concepts=['between','beside','above','below','nearest','farthest','pair','half','equal','few','many','first','last','before','after','beginning','end','never','always','medium'];
  return concepts.map(c=>{
    const scene=conceptScene(c);
    if(!scene) return {concept:c,instruction:'Which is '+c+'?',svg:()=>'',options:['A','B','C'],correct:0};
    return {concept:c, instruction:scene.instruction, svg:scene.svg, options:scene.options, correct:scene.correct};
  });
}

// Score to Mental Age mapping (years-months)
const SCORE_TO_MA = {
  1:[3,3],2:[3,6],3:[3,9],4:[4,0],5:[4,3],6:[4,6],7:[4,9],8:[5,0],
  9:[5,3],10:[5,6],11:[5,9],12:[6,0],13:[6,3],14:[6,6],15:[6,9],16:[7,0],
  17:[7,3],18:[7,6],19:[7,9],20:[8,0],21:[8,3],22:[8,6],23:[8,9],24:[9,0],
  25:[9,3],26:[9,6],27:[9,9],28:[10,0]
};

function getDAP_IQ(rawScore, chronologicalAgeYears){
  const capped = Math.min(Math.max(rawScore,0),28);
  if(capped===0) return {ma:3, iq:Math.round((3/chronologicalAgeYears)*100)};
  const entry = SCORE_TO_MA[capped] || [3,3];
  const maYears = entry[0] + entry[1]/12;
  const iq = Math.round((maYears / chronologicalAgeYears)*100);
  return {ma:maYears, maLabel:`${entry[0]} years ${entry[1]} months`, iq:Math.max(50,Math.min(160,iq))};
}


// ===== SCORING & NORMS =====

const NORMS = {
  matrix: {
    3:   {mean:11, sd:3, total:12},
    3.5: {mean:13, sd:3.5, total:12},
    4:   {mean:14, sd:3.5, total:12},
    5:   {mean:17, sd:4, total:18},
    5.5: {mean:19, sd:4, total:18},
    6:   {mean:21, sd:4.5, total:18}
  },
  vocab: {
    3:   {mean:10, sd:2.5, total:15},
    5:   {mean:14, sd:3, total:20}
  },
  concepts: {
    3:   {mean:8, sd:2, total:12},
    5:   {mean:14, sd:3, total:20}
  },
  quant: {
    3:   {mean:6, sd:2, total:10},
    5:   {mean:10, sd:2.5, total:15}
  }
};

function getNorm(module, ageYears){
  const norms = NORMS[module];
  if(!norms) return {mean:0,sd:1,total:1};
  // Find closest age key
  const keys = Object.keys(norms).map(Number).sort((a,b)=>a-b);
  let closest = keys[0];
  for(const k of keys){
    if(Math.abs(k-ageYears) < Math.abs(closest-ageYears)) closest=k;
  }
  return norms[closest];
}

// Normal CDF approximation (Abramowitz & Stegun)
function normalCDF(z){
  if(z<-6) return 0;
  if(z>6) return 1;
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const sign = z<0?-1:1;
  const x = Math.abs(z)/Math.sqrt(2);
  const t = 1/(1+p*x);
  const erf = 1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1+sign*erf);
}

function computeScores(module, raw, ageYears){
  const norm = getNorm(module, ageYears);
  const z = (raw - norm.mean) / norm.sd;
  const percentile = Math.round(normalCDF(z)*100);
  const iq = Math.round(100 + 15*z);
  const clampedIQ = Math.max(40, Math.min(160, iq));
  return {raw, total:norm.total, z:Math.round(z*100)/100, percentile:Math.max(1,Math.min(99,percentile)), iq:clampedIQ};
}

function getClassification(iq){
  if(iq<70) return {label:'Very Low', color:'#E74C3C'};
  if(iq<80) return {label:'Low', color:'#E67E22'};
  if(iq<90) return {label:'Below Average', color:'#F39C12'};
  if(iq<110) return {label:'Average', color:'#27AE60'};
  if(iq<120) return {label:'Above Average', color:'#3498DB'};
  if(iq<130) return {label:'Superior', color:'#8E44AD'};
  return {label:'Very Superior', color:'#9B59B6'};
}

function barColor(percentile){
  if(percentile<10) return '#E74C3C';
  if(percentile<25) return '#F39C12';
  if(percentile<75) return '#27AE60';
  if(percentile<90) return '#3498DB';
  return '#8E44AD';
}

      </div>

      </div>

    </div>

function initCanvas(){
  drawCanvas=document.getElementById('draw-canvas');
  const area=document.getElementById('draw-area');
  const w=Math.min(area.clientWidth, 600);
  const h=Math.min(w*1.2, 500);
  drawCanvas.width=w;
  drawCanvas.height=h;
  drawCanvas.style.width=w+'px';
  drawCanvas.style.height=h+'px';
  drawCtx=drawCanvas.getContext('2d');
  drawCtx.fillStyle='#FFF';
  drawCtx.fillRect(0,0,w,h);
  drawCtx.lineCap='round';
  drawCtx.lineJoin='round';
  undoStack=[drawCtx.getImageData(0,0,w,h)];

  // Mouse events
  drawCanvas.addEventListener('mousedown',startDraw);
  drawCanvas.addEventListener('mousemove',doDraw);
  drawCanvas.addEventListener('mouseup',endDraw);
  drawCanvas.addEventListener('mouseleave',endDraw);
  // Touch events
  drawCanvas.addEventListener('touchstart',e=>{e.preventDefault();startDraw(touchToMouse(e));},{passive:false});
  drawCanvas.addEventListener('touchmove',e=>{e.preventDefault();doDraw(touchToMouse(e));},{passive:false});
  drawCanvas.addEventListener('touchend',e=>{e.preventDefault();endDraw();},{passive:false});
}

function touchToMouse(e){
  const t=e.touches[0];
  const r=drawCanvas.getBoundingClientRect();
  return {offsetX:t.clientX-r.left, offsetY:t.clientY-r.top};
}

function getDrawPos(e){
  const r=drawCanvas.getBoundingClientRect();
  const scaleX=drawCanvas.width/r.width;
  const scaleY=drawCanvas.height/r.height;
  return {x:(e.offsetX||e.clientX-r.left)*scaleX, y:(e.offsetY||e.clientY-r.top)*scaleY};
}

function startDraw(e){
  isDrawing=true;
  const p=getDrawPos(e);
  drawCtx.beginPath();
  drawCtx.moveTo(p.x,p.y);
  drawCtx.strokeStyle=drawTool==='eraser'?'#FFF':'#000';
  drawCtx.lineWidth=drawTool==='eraser'?penSize*4:penSize;
}

function doDraw(e){
  if(!isDrawing) return;
  const p=getDrawPos(e);
  drawCtx.lineTo(p.x,p.y);
  drawCtx.stroke();
}

function endDraw(){
  if(!isDrawing) return;
  isDrawing=false;
  drawCtx.closePath();
  undoStack.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height));
  if(undoStack.length>30) undoStack.shift();
}

function setDrawTool(tool){
  drawTool=tool;
  document.getElementById('tool-pen').classList.toggle('tool-active',tool==='pen');
  document.getElementById('tool-eraser').classList.toggle('tool-active',tool==='eraser');
}

function changePenSize(d){
  penSize=Math.max(1,Math.min(12,penSize+d));
}

function undoDraw(){
  if(undoStack.length>1){
    undoStack.pop();
    drawCtx.putImageData(undoStack[undoStack.length-1],0,0);
  }
}

function clearDraw(){
  drawCtx.fillStyle='#FFF';
  drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  undoStack=[drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height)];
}

function finishDrawing(){
  state.drawData=drawCanvas.toDataURL('image/png');
  renderDAPChecklist();
}

function renderDAPChecklist(){
  app.innerHTML=`
    <div class="page">
      <h2>Score the Drawing</h2>
      <p style="color:#666;margin:8px 0">Check each feature that is clearly present in ${state.child.name}'s drawing.</p>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
        <div style="flex:1;min-width:280px">
          <div class="checklist">
            ${DAP_ITEMS.map(g=>`
              <div class="checklist-group">
                <h3>Class ${g.group}: ${g.label}</h3>
                ${g.items.map(it=>`
                  <label><input type="checkbox" value="${it.id}" onchange="updateDAPScore()"> ${it.text}</label>
                `).join('')}
              </div>
            `).join('')}
          </div>
        </div>
        <div style="flex:0 0 200px;position:sticky;top:16px">
          ${state.drawData?`<img src="${state.drawData}" style="width:200px;border-radius:8px;box-shadow:var(--shadow)"/>`:''}
          <div class="card" style="text-align:center;margin-top:12px">
            <div style="font-size:.9rem;color:#666">Raw Score</div>
            <div id="dap-raw" style="font-size:2rem;font-weight:700;color:var(--blue)">0</div>
            <div id="dap-ma" style="font-size:.85rem;color:#666"></div>
            <div id="dap-iq" style="font-size:1.1rem;font-weight:700;margin-top:4px"></div>
          </div>
        </div>
      </div>
      <button class="next-btn" onclick="submitDAP()">Continue</button>
    </div>
  `;
}

function updateDAPScore(){
  const checks=document.querySelectorAll('.checklist input:checked');
  const raw=checks.length;
  document.getElementById('dap-raw').textContent=raw;
  const age=getAge(state.child.dob);
  const result=getDAP_IQ(raw, age.total);
  document.getElementById('dap-ma').textContent=result.maLabel?'MA: '+result.maLabel:'';
  const cls=getClassification(result.iq);
  document.getElementById('dap-iq').innerHTML=`IQ: ${result.iq} <span class="classification" style="background:${cls.color}">${cls.label}</span>`;
}

function submitDAP(){
  const checks=document.querySelectorAll('.checklist input:checked');
  const raw=checks.length;
  const age=getAge(state.child.dob);
  const result=getDAP_IQ(raw, age.total);
  state.answers['dap']={raw, iq:result.iq, ma:result.ma, maLabel:result.maLabel, checkedItems:Array.from(checks).map(c=>c.value)};
  state.currentMod++;
  _itemsCache={};
  runCurrentModule();
}


// ===== RESULTS PAGE =====

function showResults(){
  clearTimers();
  const age=getAge(state.child.dob);
  const results={};
  let iqSum=0, iqCount=0;

  for(const modId of state.modules){
    if(modId==='dap'){
      const d=state.answers['dap'];
      if(d){
        results['dap']={raw:d.raw, total:51, percentile:null, iq:d.iq, maLabel:d.maLabel};
        iqSum+=d.iq; iqCount++;
      }
    } else {
      const answers=state.answers[modId]||[];
      const raw=answers.filter(a=>a.isCorrect).length;
      const scores=computeScores(modId, raw, age.total);
      results[modId]=scores;
      iqSum+=scores.iq; iqCount++;
    }
  }

  const compositeIQ = iqCount>0 ? Math.round(iqSum/iqCount) : 100;
  const compClass=getClassification(compositeIQ);

  // Save to history
  const entry={
    date:new Date().toISOString(),
    child:state.child.name,
    childDob:state.child.dob,
    age:age.label,
    ageTotal:age.total,
    modules:state.modules,
    results:results,
    compositeIQ:compositeIQ,
    totalTime:totalSeconds,
    drawData:state.drawData||null
  };
  saveHistory(entry);

  // Render
  let modRows='';
  let barRows='';
  for(const modId of state.modules){
    const r=results[modId];
    if(!r) continue;
    const cls=getClassification(r.iq);
    const pct = r.percentile!==null ? r.percentile+'%' : 'N/A';
    modRows+=`<tr>
      <td>${getModuleName(modId)}</td>
      <td>${r.raw}/${r.total}</td>
      <td>${pct}</td>
      <td>${r.iq}</td>
      <td><span class="classification" style="background:${cls.color}">${cls.label}</span></td>
    </tr>`;
    if(r.percentile!==null){
      barRows+=`<div class="bar-row">
        <div class="bar-label">${getModuleName(modId)}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${r.percentile}%;background:${barColor(r.percentile)}">${r.percentile}%</div>
        </div>
      </div>`;
    }
  }

  app.innerHTML=`
    <div class="page">
      <nav><button class="btn-outline" onclick="renderLanding()">Home</button><button class="btn-outline" onclick="renderHistory()">History</button></nav>
      <h1>Results for ${state.child.name}</h1>
      <p style="text-align:center;color:#666">Age: ${age.label} | Total time: ${formatTime(totalSeconds)}</p>

      <div class="composite-score">
        <div class="lbl">Composite IQ Estimate</div>
        <div class="big">${compositeIQ}</div>
        <div class="lbl"><span class="classification" style="background:rgba(255,255,255,.2)">${compClass.label}</span></div>
      </div>

      <div class="result-card">
        <h2>Percentile by Domain</h2>
        <div class="bar-chart">${barRows}</div>
      </div>

      <div class="result-card">
        <h2>Detailed Scores</h2>
        <div style="overflow-x:auto">
          <table class="score-table">
            <thead><tr><th>Module</th><th>Raw</th><th>Percentile</th><th>IQ</th><th>Classification</th></tr></thead>
            <tbody>${modRows}</tbody>
          </table>
        </div>
      </div>

      ${state.drawData?`
      <div class="result-card">
        <h2>Draw-a-Person</h2>
        <div style="text-align:center"><img src="${state.drawData}" style="max-width:300px;border-radius:8px;box-shadow:var(--shadow)"/></div>
        ${results.dap?`<p style="text-align:center;margin-top:12px">Raw Score: ${results.dap.raw}/51 | Mental Age: ${results.dap.maLabel||'N/A'} | IQ: ${results.dap.iq}</p>`:''}
      </div>`:''}

      <div class="result-card" style="background:#FFF9C4;border:2px solid #F39C12">
        <h3 style="color:#E67E22">Important Note</h3>
        <p style="font-size:.9rem;color:#666;line-height:1.5">
          This assessment provides <strong>estimates only</strong> and is not a substitute for formal psychological testing.
          Results should be interpreted with caution. Factors such as attention, motivation, familiarity with technology,
          and testing conditions can all influence performance. For a comprehensive evaluation, consult a licensed psychologist.
        </p>
      </div>

      <div class="action-btns">
        <button class="btn-blue" onclick="renderLanding()">New Test</button>
        <button class="btn-purple" onclick="renderHistory()">View History</button>
      </div>
    </div>
  `;

  // Animate bars
  setTimeout(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{
      el.style.transition='width 0.8s ease';
    });
  },100);
}


// ===== HISTORY PAGE =====

function renderHistory(){
  clearTimers();
  const history=getHistory();

  let entriesHTML='';
  if(history.length===0){
    entriesHTML='<p style="text-align:center;color:#666;padding:32px">No test history yet. Complete a test to see results here.</p>';
  } else {
    const sorted=[...history].reverse();
    entriesHTML=sorted.map((h,i)=>{
      const cls=getClassification(h.compositeIQ);
      const d=new Date(h.date);
      const dateStr=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const mods=h.modules.map(m=>getModuleName(m)).join(', ');
      return `<div class="history-entry" onclick="showHistoryDetail(${history.length-1-i})">
        <span class="iq" style="color:${cls.color}">${h.compositeIQ}</span>
        <div class="child">${h.child}</div>
        <div class="date">${dateStr} | ${h.age} | ${formatTime(h.totalTime||0)}</div>
        <div style="font-size:.8rem;color:#999;margin-top:4px">${mods}</div>
      </div>`;
    }).join('');
  }

  // Line chart
  let chartHTML='';
  if(history.length>=2){
    chartHTML=renderLineChart(history);
  }

  app.innerHTML=`
    <div class="page">
      <nav><button class="btn-outline" onclick="renderLanding()">Home</button><div></div></nav>
      <h1>Test History</h1>

      ${chartHTML?`<div class="line-chart-container"><h3>Composite IQ Over Time</h3>${chartHTML}</div>`:''}

      ${entriesHTML}

      <div class="action-btns">
        <button class="btn-green" onclick="exportHistory()">Export JSON</button>
        <button class="btn-red" onclick="clearHistory()">Clear All History</button>
      </div>
    </div>
  `;
}

function renderLineChart(history){
  const W=600, H=250, pad={t:30,r:30,b:50,l:50};
  const plotW=W-pad.l-pad.r, plotH=H-pad.t-pad.b;

  // Get data points per child
  const childData={};
  history.forEach((h,i)=>{
    if(!childData[h.child]) childData[h.child]=[];
    childData[h.child].push({x:i,iq:h.compositeIQ,date:h.date});
  });

  const minIQ=Math.min(...history.map(h=>h.compositeIQ))-10;
  const maxIQ=Math.max(...history.map(h=>h.compositeIQ))+10;
  const n=history.length;

  function px(xi){return pad.l+(xi/(n-1||1))*plotW}
  function py(iq){return pad.t+plotH-(iq-minIQ)/(maxIQ-minIQ)*plotH}

  let svg='';
  // Grid
  for(let iq=Math.ceil(minIQ/10)*10;iq<=maxIQ;iq+=10){
    const y=py(iq);
    svg+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#EEE" stroke-width="1"/>`;
    svg+=`<text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#999">${iq}</text>`;
  }
  // Reference line at 100
  svg+=`<line x1="${pad.l}" y1="${py(100)}" x2="${W-pad.r}" y2="${py(100)}" stroke="#CCC" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  svg+=`<text x="${W-pad.r+4}" y="${py(100)+4}" font-size="9" fill="#999">Avg</text>`;

  // Axes
  svg+=`<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${H-pad.b}" stroke="#333" stroke-width="1.5"/>`;
  svg+=`<line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="#333" stroke-width="1.5"/>`;

  // X labels
  history.forEach((h,i)=>{
    const x=px(i);
    const d=new Date(h.date);
    const lbl=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    svg+=`<text x="${x}" y="${H-pad.b+16}" text-anchor="middle" font-size="9" fill="#666">${lbl}</text>`;
    svg+=`<text x="${x}" y="${H-pad.b+28}" text-anchor="middle" font-size="8" fill="#999">${h.child}</text>`;
  });

  // Lines per child
  const childColors={Liam:'#4A90D9',Noah:'#27AE60'};
  for(const [child,pts] of Object.entries(childData)){
    const col=childColors[child]||'#333';
    if(pts.length>1){
      const d=pts.map((p,i)=>`${i===0?'M':'L'}${px(p.x)},${py(p.iq)}`).join(' ');
      svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
    }
    pts.forEach(p=>{
      svg+=`<circle cx="${px(p.x)}" cy="${py(p.iq)}" r="5" fill="${col}" stroke="#FFF" stroke-width="2"/>`;
      svg+=`<text x="${px(p.x)}" y="${py(p.iq)-10}" text-anchor="middle" font-size="10" fill="${col}" font-weight="700">${p.iq}</text>`;
    });
  }

  // Legend
  let lx=pad.l+10;
  for(const [child,col] of Object.entries(childColors)){
    if(childData[child]){
      svg+=`<circle cx="${lx}" cy="14" r="5" fill="${col}"/>`;
      svg+=`<text x="${lx+10}" y="18" font-size="11" fill="#333">${child}</text>`;
      lx+=70;
    }
  }

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${svg}</svg>`;
}

function showHistoryDetail(idx){
  const history=getHistory();
  const h=history[idx];
  if(!h) return;

  let modRows='';
  for(const modId of h.modules){
    const r=h.results[modId];
    if(!r) continue;
    const cls=getClassification(r.iq);
    const pct=r.percentile!==null&&r.percentile!==undefined?r.percentile+'%':'N/A';
    modRows+=`<tr>
      <td>${getModuleName(modId)}</td>
      <td>${r.raw}/${r.total}</td>
      <td>${pct}</td>
      <td>${r.iq}</td>
      <td><span class="classification" style="background:${cls.color}">${cls.label}</span></td>
    </tr>`;
  }
  const cls=getClassification(h.compositeIQ);
  const d=new Date(h.date);

  app.innerHTML=`
    <div class="page">
      <nav><button class="btn-outline" onclick="renderHistory()">Back to History</button><button class="btn-outline" onclick="renderLanding()">Home</button></nav>
      <h1>${h.child} - ${d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</h1>
      <p style="text-align:center;color:#666">Age: ${h.age} | Time: ${formatTime(h.totalTime||0)}</p>
      <div class="composite-score">
        <div class="lbl">Composite IQ</div>
        <div class="big">${h.compositeIQ}</div>
        <div class="lbl"><span class="classification" style="background:rgba(255,255,255,.2)">${cls.label}</span></div>
      </div>
      <div class="result-card">
        <div style="overflow-x:auto">
          <table class="score-table">
            <thead><tr><th>Module</th><th>Raw</th><th>Percentile</th><th>IQ</th><th>Classification</th></tr></thead>
            <tbody>${modRows}</tbody>
          </table>
        </div>
      </div>
      ${h.drawData?`<div class="result-card"><h2>Drawing</h2><div style="text-align:center"><img src="${h.drawData}" style="max-width:300px;border-radius:8px;box-shadow:var(--shadow)"/></div></div>`:''}
    </div>
  `;
}

function exportHistory(){
  const h=getHistory();
  const blob=new Blob([JSON.stringify(h,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='kids-iq-history.json';a.click();
  URL.revokeObjectURL(url);
}

function clearHistory(){
  if(confirm('Are you sure you want to delete ALL test history? This cannot be undone.')){
    localStorage.removeItem(LS_KEY);
    renderHistory();
  }
}

// ===== INIT =====
renderLanding();


</script>
</body>
